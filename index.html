{id:'1-2',p:'은 / 는',n:'〜は',d:'話題を示す助詞。パッチムあり→은、なし→는。自己紹介の 저는 は最初に塊で覚える。',ex:[['저는 일본 사람이에요.','私は日本人です。'],['오늘은 괜찮아요.','今日は大丈夫です。']],listen:'저는 は会話で非常に頻出。逐語訳せず「私は〜」の開始合図として取る。'},
{id:'1-3',p:'이 / 가',n:'〜が',d:'主語を示す基本助詞。パッチムあり→이、なし→가。最初は 은/는 との細かな違いより認識を優先。',ex:[['이름이 뭐예요?','名前は何ですか？'],['여기가 역이에요.','ここが駅です。']],listen:'이름이 のように前後がつながる音をまとまりで聞く。'},
{id:'1-4',p:'있어요 / 없어요',n:'あります・います / ありません・いません',d:'物や人の存在、有無を表す超重要表現。',ex:[['화장실 있어요?','トイレはありますか？'],['시간이 없어요.','時間がありません。']],listen:'旅行では「있어요?」という上がり調子の質問を即座に拾えるようにする。'},
{id:'1-5',p:'주세요',n:'ください',d:'名詞＋주세요 で「〜をください」。旅行で最優先の依頼表現。',ex:[['물 주세요.','水をください。'],['이거 주세요.','これをください。']],listen:'注文場面では名詞より 주세요 が聞こえたら「依頼」だと判断する。'},
{id:'1-6',p:'뭐 / 어디 + 예요?',n:'何ですか / どこですか',d:'疑問詞を使う最初の質問。',ex:[['이거 뭐예요?','これは何ですか？'],['화장실 어디예요?','トイレはどこですか？']],listen:'뭐예요・어디예요 を一語のように認識する。'}]},
2:{title:'生活文を組み立てる',goal:'注文・場所・時刻など短い生活文を正確に理解。',items:[
{id:'2-1',p:'을 / 를',n:'〜を',d:'目的語を示す助詞。パッチムあり→을、なし→를。',ex:[['커피를 마셔요.','コーヒーを飲みます。'],['밥을 먹어요.','ご飯を食べます。']],listen:'会話では助詞が弱く発音されることもあるので動詞とのセットで意味を取る。'},
{id:'2-2',p:'에 / 에서',n:'〜に / 〜で',d:'에 は到着点・時刻など、에서 は動作する場所。',ex:[['서울에 가요.','ソウルに行きます。'],['카페에서 먹어요.','カフェで食べます。']],listen:'場所語の直後に何が続くかで移動か動作かを判断。'},
{id:'2-3',p:'-아요 / -어요',n:'丁寧な現在形',d:'日常会話の基本語尾。「します・です」に相当する広い丁寧形。',ex:[['먹어요.','食べます。'],['좋아요.','いいです／好きです。']],listen:'語幹より語尾が弱くなることがある。文末の 억양 も含めて聞く。'},
{id:'2-4',p:'안 / 못',n:'〜しない / 〜できない',d:'안 は意思・状態の否定、못 は能力や事情でできない。',ex:[['안 먹어요.','食べません。'],['한국어를 잘 못해요.','韓国語が上手にできません。']],listen:'旅行で「못 알아들어요（聞き取れません）」につながる重要概念。'},
{id:'2-5',p:'하고 / 와 / 과',n:'〜と',d:'名詞をつなぐ。「하고」は会話で使いやすい。',ex:[['친구하고 가요.','友達と行きます。'],['커피와 빵','コーヒーとパン']],listen:'日常会話では 하고 を優先的に認識。'},
{id:'2-6',p:'-(으)세요',n:'〜してください / 〜なさいます',d:'丁寧な命令・依頼、または尊敬表現。店員の発話で頻出。',ex:[['여기 앉으세요.','ここに座ってください。'],['들어오세요.','お入りください。']],listen:'店・ホテルで相手から言われる側として理解することを重視。'}]},
3:{title:'時間軸と希望',goal:'過去・未来・希望を含む1〜2文を理解。',items:[
{id:'3-1',p:'-았어요 / -었어요',n:'〜しました',d:'過去を表す基本語尾。',ex:[['어제 갔어요.','昨日行きました。'],['밥 먹었어요?','ご飯食べましたか？']],listen:'먹었어요? は日常会話で挨拶的にも使われる。'},
{id:'3-2',p:'-(으)ㄹ 거예요',n:'〜するつもりです / 〜でしょう',d:'予定・未来・推測を表す。',ex:[['내일 갈 거예요.','明日行く予定です。'],['비가 올 거예요.','雨が降るでしょう。']],listen:'会話では ㄹ 거예요 が「ルコエヨ」にまとまって聞こえる。'},
{id:'3-3',p:'-고 싶어요',n:'〜したいです',d:'希望を表す最重要表現。',ex:[['한국에 가고 싶어요.','韓国に行きたいです。'],['뭐 먹고 싶어요?','何を食べたいですか？']],listen:'旅行・雑談の双方で頻出。動詞＋고 싶어요 を塊で覚える。'},
{id:'3-4',p:'-고 있어요',n:'〜しています',d:'進行中の動作や状態を表す。',ex:[['지금 먹고 있어요.','今食べています。'],['기다리고 있어요.','待っています。']],listen:'고 있어요 の連続音に慣れる。'},
{id:'3-5',p:'도 / 만',n:'〜も / 〜だけ',d:'情報を追加・限定する助詞。',ex:[['저도 좋아해요.','私も好きです。'],['물만 주세요.','水だけください。']],listen:'短い助詞だが会話の意味を大きく変える。'},
{id:'3-6',p:'부터 / 까지',n:'〜から / 〜まで',d:'時間・場所の範囲を表す。',ex:[['아홉 시부터예요.','9時からです。'],['역까지 가요.','駅まで行きます。']],listen:'営業時間や交通案内で必須。'}]},
4:{title:'旅行を自力で処理する文法',goal:'理由・条件・依頼・許可まで扱い、定型外の旅行会話へ。',items:[
{id:'4-1',p:'-아/어서',n:'〜して / 〜なので',d:'動作の順序や自然な理由をつなぐ。',ex:[['호텔에 가서 쉬어요.','ホテルに行って休みます。'],['피곤해서 쉬고 싶어요.','疲れたので休みたいです。']],listen:'会話では文同士をつなぐ主要接続表現。'},
{id:'4-2',p:'-(으)니까',n:'〜だから',d:'理由をやや明確に示す。',ex:[['늦었으니까 택시 타요.','遅いのでタクシーに乗ります。'],['비가 오니까 조심하세요.','雨なので気をつけてください。']],listen:'相手の理由説明を聞き取る鍵。'},
{id:'4-3',p:'-(으)면',n:'〜なら / 〜すれば',d:'条件を表す。',ex:[['시간이 있으면 가요.','時間があれば行きます。'],['모르면 물어보세요.','分からなければ聞いてください。']],listen:'案内・提案・トラブル対応でよく出る。'},
{id:'4-4',p:'-지만',n:'〜ですが',d:'逆接。「でも」に近い流れを作る。',ex:[['비싸지만 좋아요.','高いですが良いです。'],['작지만 깨끗해요.','小さいですがきれいです。']],listen:'前半と後半で評価が反転することに注意。'},
{id:'4-5',p:'-아/어 주세요',n:'〜してください',d:'動詞につける具体的な依頼。',ex:[['천천히 말해 주세요.','ゆっくり話してください。'],['다시 말해 주세요.','もう一度言ってください。']],listen:'スマホなし旅行の生命線になる聞き返し表現。'},
{id:'4-6',p:'-아/어도 돼요?',n:'〜してもいいですか',d:'許可を求める。',ex:[['여기 앉아도 돼요?','ここに座ってもいいですか？'],['사진 찍어도 돼요?','写真を撮ってもいいですか？']],listen:'許可・禁止のやり取りに必須。'}]},
5:{title:'会話を長くする',goal:'経験・計画・同時動作・推測を使って10〜20秒の会話を追う。',items:[
{id:'5-1',p:'-아/어 본 적이 있어요',n:'〜したことがあります',d:'経験を表す。',ex:[['부산에 가 본 적이 있어요.','釜山に行ったことがあります。'],['먹어 본 적 있어요?','食べたことありますか？']],listen:'雑談で頻出する経験質問。'},
{id:'5-2',p:'-(으)려고 해요',n:'〜しようと思います',d:'意図・計画。',ex:[['주말에 여행하려고 해요.','週末に旅行しようと思います。'],['지금 먹으려고 해요.','今食べようと思っています。']],listen:'予定の話題でよく出る。'},
{id:'5-3',p:'-기 전에 / -(으)ㄴ 후에',n:'〜する前に / 〜した後で',d:'時間関係を明確にする。',ex:[['자기 전에 봐요.','寝る前に見ます。'],['먹은 후에 가요.','食べた後に行きます。']],listen:'長めの案内を時系列で理解する練習。'},
{id:'5-4',p:'-거나',n:'〜したり / 〜か',d:'選択肢を並べる。',ex:[['걷거나 버스를 타요.','歩くかバスに乗ります。'],['영화를 보거나 음악을 들어요.','映画を見たり音楽を聞いたりします。']],listen:'複数候補の列挙を聞き分ける。'},
{id:'5-5',p:'-(으)면서',n:'〜しながら',d:'同時に行う動作。',ex:[['음악을 들으면서 공부해요.','音楽を聞きながら勉強します。'],['걸으면서 이야기해요.','歩きながら話します。']],listen:'日常トークで自然に出る接続。'},
{id:'5-6',p:'-는 것 같아요',n:'〜ようです / 〜と思います',d:'断定を避けた推測・感想。',ex:[['비가 오는 것 같아요.','雨が降っているようです。'],['맛있는 것 같아요.','おいしい気がします。']],listen:'アイドルの感想トークでも頻出。'}]},
6:{title:'自立旅行と説明理解',goal:'トラブル・変更・説明を自然速度で処理。',items:[
{id:'6-1',p:'-아/어야 해요',n:'〜しなければなりません',d:'義務・必要。',ex:[['지금 가야 해요.','今行かなければなりません。'],['예약해야 해요?','予約しないといけませんか？']],listen:'交通・施設ルールで必須。'},
{id:'6-2',p:'-는데 / -(으)ㄴ데',n:'〜ですが / 〜なんですが',d:'背景を示して次の発話につなげる非常に口語的な接続。',ex:[['예약했는데 확인해 주세요.','予約したのですが確認してください。'],['길을 모르는데 도와주세요.','道が分からないのですが助けてください。']],listen:'実会話で非常に多く、文末が続きそうだと予測できる。'},
{id:'6-3',p:'-다고 / 라고 하다',n:'〜と言う',d:'他人の発言や情報を伝える間接話法。',ex:[['내일 온다고 했어요.','明日来ると言いました。'],['여기가 맞다고 했어요.','ここで合っていると言いました。']],listen:'説明の中に「誰かの発言」が入る構造を捉える。'},
{id:'6-4',p:'-(으)ㄹ 때',n:'〜するとき',d:'時点・状況を表す。',ex:[['한국에 갈 때 써요.','韓国へ行くとき使います。'],['시간이 없을 때 택시 타요.','時間がないときタクシーに乗ります。']],listen:'長めの条件説明を整理する。'},
{id:'6-5',p:'-아/어 버리다',n:'〜してしまう',d:'完了と残念・すっきり等の感情ニュアンス。',ex:[['지갑을 잃어버렸어요.','財布をなくしてしまいました。'],['다 먹어버렸어요.','全部食べてしまいました。']],listen:'トラブル会話で重要。'},
{id:'6-6',p:'-아/어 놓다',n:'〜しておく',d:'後のために状態を準備・維持する。',ex:[['예약해 놓았어요.','予約しておきました。'],['문을 열어 놓았어요.','ドアを開けておきました。']],listen:'ホテル・予約・準備の説明理解に役立つ。'}]},
7:{title:'日常会話のニュアンス',goal:'반말・相槌・推測・軽い主張を理解して友達会話へ。',items:[
{id:'7-1',p:'반말 기본형',n:'タメ口の基本',d:'요 を外すだけではない形もあるため、頻出型をまとまりで覚える。',ex:[['뭐 해?','何してる？'],['진짜 좋아.','本当に好き。']],listen:'アイドル同士の会話理解に直結。'},
{id:'7-2',p:'-잖아(요)',n:'〜じゃない（ですか）',d:'共有認識や念押しを表す。',ex:[['알잖아.','知ってるじゃん。'],['좋잖아요.','いいじゃないですか。']],listen:'直訳より「相手も知っているよね」のニュアンスを取る。'},
{id:'7-3',p:'-거든(요)',n:'〜なんです / 〜だからね',d:'背景説明や軽い強調。',ex:[['제가 좋아하거든요.','私が好きなんですよ。'],['오늘 바쁘거든.','今日忙しいんだ。']],listen:'文末に来ると理由・背景の提示になりやすい。'},
{id:'7-4',p:'-네요',n:'〜ですね / 〜なんですね',d:'その場で気づいた感想・驚き。',ex:[['맛있네요.','おいしいですね。'],['사람이 많네요.','人が多いですね。']],listen:'リアクションとして意味を取る。'},
{id:'7-5',p:'-나 봐요',n:'〜みたいです',d:'見聞きした根拠からの推測。',ex:[['비가 오나 봐요.','雨が降っているみたいです。'],['바쁜가 봐요.','忙しいみたいです。']],listen:'会話で推測を示す代表表現。'},
{id:'7-6',p:'-(으)ㄹ래요? / -자',n:'〜しますか？ / 〜しよう',d:'親しい提案・意思。',ex:[['같이 갈래요?','一緒に行きますか？'],['같이 가자.','一緒に行こう。']],listen:'友達・メンバー同士の会話で頻出。'}]},
8:{title:'自然な口語をほどく',goal:'省略・縮約・会話マーカーを認識して30〜60秒のトークへ。',items:[
{id:'8-1',p:'거예요 → 거야',n:'〜なんです / 〜なの',d:'丁寧形と반말の対応を音で認識。',ex:[['뭐 하는 거예요?','何をしているんですか？'],['뭐 하는 거야?','何してるの？']],listen:'動画では 거야 が非常に速く聞こえる。'},
{id:'8-2',p:'근데 / 그래서 / 그러니까',n:'でも / だから / つまり',d:'会話の流れを作る談話標識。',ex:[['근데 진짜 좋아.','でも本当に好き。'],['그래서 갔어요.','それで行きました。']],listen:'単語の意味以上に「話の向きが変わる合図」として取る。'},
{id:'8-3',p:'-긴 하다',n:'〜ではある',d:'一部認めつつ含みを残す。',ex:[['맛있긴 해요.','おいしくはあります。'],['좋긴 한데…','良くはあるんだけど…']],listen:'後半に逆接や保留が来ることを予測。'},
{id:'8-4',p:'-는 편이다',n:'〜する方だ',d:'傾向を柔らかく述べる。',ex:[['자주 가는 편이에요.','よく行く方です。'],['조용한 편이에요.','静かな方です。']],listen:'自己分析・性格・習慣の会話に頻出。'},
{id:'8-5',p:'-게 되다',n:'〜することになる',d:'状況変化や成り行き。',ex:[['한국에서 살게 됐어요.','韓国で暮らすことになりました。'],['알게 됐어요.','知るようになりました。']],listen:'인터뷰の経緯説明でよく出る。'},
{id:'8-6',p:'아니 / 약간 / 그냥',n:'いや / ちょっと / なんとなく',d:'口語フィラー・ニュアンス語。文法というより実戦Listening上の必須要素。',ex:[['아니, 그게 아니라…','いや、そうじゃなくて…'],['그냥 좋아요.','なんとなく好きです。']],listen:'字幕なし理解では内容語以上に会話リズムの把握に効く。'}]},
9:{title:'高速会話と含意',goal:'話者の経験・驚き・後悔・因果を文脈から推論。',items:[
{id:'9-1',p:'-더라고요',n:'〜だったんですよ',d:'話者が実際に経験して気づいたことを述べる。',ex:[['생각보다 어렵더라고요.','思ったより難しかったんですよ。'],['진짜 맛있더라고요.','本当においしかったんですよ。']],listen:'体験談・レビューの定番。'},
{id:'9-2',p:'-던데(요)',n:'〜でしたけど / 〜でしたよ',d:'過去の経験を背景として提示し、含みを持たせる。',ex:[['사람이 많던데요.','人が多かったですよ。'],['괜찮던데?','大丈夫だったけど？']],listen:'文末だけで発話意図が変わるのでイントネーションも重視。'},
{id:'9-3',p:'-(으)ㄹ 뻔했어요',n:'〜するところでした',d:'実際には起こらなかった危機・寸前。',ex:[['늦을 뻔했어요.','遅れるところでした。'],['넘어질 뻔했어요.','転ぶところでした。']],listen:'体験談のオチで頻出。'},
{id:'9-4',p:'-다 보니',n:'〜しているうちに',d:'継続の結果、変化・発見が生じる。',ex:[['듣다 보니 익숙해졌어요.','聞いているうちに慣れました。'],['하다 보니 좋아졌어요.','やっているうちに良くなりました。']],listen:'長めの説明の因果関係を取る。'},
{id:'9-5',p:'-는 바람에',n:'〜したせいで',d:'予想外・望ましくない原因。',ex:[['비가 오는 바람에 못 갔어요.','雨のせいで行けませんでした。'],['늦잠 자는 바람에 늦었어요.','寝坊したせいで遅れました。']],listen:'原因→結果を高速で処理する。'},
{id:'9-6',p:'-나 싶어요',n:'〜かなと思います',d:'控えめな推測・考え。',ex:[['괜찮지 않나 싶어요.','大丈夫ではないかと思います。'],['이게 맞나 싶어요.','これで合っているのかなと思います。']],listen:'インタビュー等の慎重な意見表明。'}]},
10:{title:'字幕なし理解の仕上げ',goal:'高級文法と口語を統合し、逐語訳せず意図を取る。',items:[
{id:'10-1',p:'-(으)ㄹ 리가 없다',n:'〜するはずがない',d:'強い否定推量。',ex:[['그럴 리가 없어요.','そんなはずがありません。'],['모를 리가 없죠.','知らないはずがないでしょう。']],listen:'反応・議論で瞬時に態度を取る。'},

function localSystemPrompt(){const sc=liveScenarios[state.liveScenario];const lv=state.liveLevel;const vocab=VOCAB_TARGETS[Math.max(0,Math.min(9,lv-1))];const rules=lv<=2?'Use very short beginner Korean, usually one sentence.':lv<=4?'Use short everyday Korean, one or two sentences.':lv<=7?'Use natural conversational Korean, usually two short sentences.':'Use natural native-like Korean with contractions and reactions when appropriate, but keep each turn concise.';return `You are a Korean conversation partner for a Japanese learner. Role: ${sc.role}. Scene: ${sc.name}. Learner level: ${lv}/10. Cumulative receptive vocabulary target: about ${vocab} common learner words. ${rules} Prefer common vocabulary appropriate to that target and avoid unnecessarily advanced abstract vocabulary at low levels. Speak ONLY Korean. Continue naturally from what the learner actually says. Do not translate into Japanese. Do not grade or lecture. If the learner's Korean is imperfect but understandable, respond to the meaning. If you truly cannot understand, ask a natural Korean clarification. Usually end with one relevant follow-up question so the conversation keeps moving.`}
function updateLocalAIUI(){const st=document.getElementById('localAiStatus');if(st)st.textContent=state.localAIProgress||({idle:'未読込。必要なときだけ端末内AIを読み込みます。',loading:'モデルを読み込み中…',ready:'端末内AIの準備完了。会話はこのPC内で生成されます。',error:'ローカルAIを使えません。高速ルール会話へ戻せます。'}[state.localAIStatus]||'');const bar=document.getElementById('localAiBar');if(bar){const m=(state.localAIProgress||'').match(/(\d+(?:\.\d+)?)%/);bar.style.width=m?Math.min(100,Number(m[1]))+'%':state.localAIStatus==='ready'?'100%':state.localAIStatus==='loading'?'18%':'0%'}}
async function loadLocalAI(){if(state.localMode==='rules')return;if(!navigator.gpu){state.localAIStatus='error';state.localAIProgress='WebGPUに対応していないため、高速ルール会話を使用してください。';updateLocalAIUI();return}const model=localModelId();if(localAIEngine&&localAIModel===model){state.localAIStatus='ready';updateLocalAIUI();return}state.localAIStatus='loading';state.localAIProgress='WebLLMを読み込んでいます…';updateLocalAIUI();try{const webllm=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.82/+esm');state.localAIProgress='モデルを端末へ初回ダウンロードしています…';updateLocalAIUI();localAIEngine=await webllm.CreateMLCEngine(model,{initProgressCallback:(r)=>{state.localAIProgress=r.text||('読み込み '+Math.round((r.progress||0)*100)+'%');updateLocalAIUI();}});localAIModel=model;localAIMessages=[{role:'system',content:localSystemPrompt()}];state.localAIStatus='ready';state.localAIProgress='準備完了 · '+(state.localMode==='local15'?'Local AI Plus 1.5B':'Local AI Lite 0.5B');updateLocalAIUI()}catch(e){console.error(e);localAIEngine=null;localAIModel='';state.localAIStatus='error';state.localAIProgress='ローカルAIの読み込みに失敗しました。高速ルール会話ならそのまま無料で使えます。';updateLocalAIUI()}}
function sanitizeLocalAI(t){return (t||'').replace(/<think>[\s\S]*?<\/think>/gi,'').replace(/```[\s\S]*?```/g,'').replace(/^[-*#]+\s*/gm,'').trim().replace(/^"|"$/g,'')}
async function generateLocalAIReply(text){if(!localAIEngine||state.localAIStatus!=='ready')return scenarioReply(text);if(!localAIMessages.length)localAIMessages=[{role:'system',content:localSystemPrompt()}];localAIMessages[0]={role:'system',content:localSystemPrompt()};localAIMessages.push({role:'user',content:text});if(localAIMessages.length>11)localAIMessages=[localAIMessages[0],...localAIMessages.slice(-10)];try{const out=await localAIEngine.chat.completions.create({messages:localAIMessages,temperature:.78,max_tokens:96});let reply=sanitizeLocalAI(out.choices?.[0]?.message?.content||'');if(!reply)reply=scenarioReply(text);localAIMessages.push({role:'assistant',content:reply});return levelReply(reply)}catch(e){console.warn('local ai fallback',e);return scenarioReply(text)}}
function scenarioReply(t){const m=extractMeaning(t),s=state.liveScenario,n=liveMemory.turns;let r='';
 if(s==='cafe'){
   if(m.q==='얼마'||/가격|원이에요/.test(t))r='아메리카노는 사천오백 원이고 라테는 오천 원이에요. 어떤 걸로 드릴까요?';
   else if(/추천|뭐가 좋아|뭐가 맛/.test(t))r='요즘은 아이스 라테가 제일 인기 많아요. 달지 않은 걸 좋아하세요?';
   else if(m.drink||m.food)r=n%3===0?`${m.drink||m.food} 좋습니다. 아이스로 드릴까요, 따뜻하게 드릴까요?`:n%3===1?'네. 사이즈는 어떻게 하실래요?':'드시고 가세요, 가지고 가세요?';
   else if(/아이스|차갑/.test(t))r='네, 아이스로 준비해 드릴게요. 사이즈는 어떻게 하실래요?';
   else if(/따뜻|뜨겁/.test(t))r='네, 따뜻하게 준비해 드릴게요. 드시고 가세요?';
   else if(/포장|가지고|테이크/.test(t))r='네, 포장으로 해 드릴게요. 더 필요한 건 없으세요?';
   else r='네, 알겠습니다. 혹시 음료나 디저트 중에 더 필요한 건 있으세요?';
 } else if(s==='hotel'){
   if(/예약/.test(t))r=m.no?'괜찮습니다. 오늘 빈방이 있는지 확인해 볼게요. 몇 분이세요?':'네, 예약자 성함이 어떻게 되세요?';
   else if(/체크인/.test(t))r='네, 도와드릴게요. 예약자 성함과 여권을 확인해도 될까요?';
   else if(/와이파이|wifi/i.test(t))r='와이파이는 무료이고 비밀번호는 객실 카드에 적혀 있어요. 또 필요한 게 있으세요?';
   else if(/수건|타월/.test(t))r='네, 수건을 더 가져다드릴게요. 몇 장 필요하세요?';
   else if(/조식|아침/.test(t))r='조식은 2층에서 아침 7시부터 10시까지예요. 이용하실 예정이세요?';
   else if(m.place||/어디/.test(t))r='로비에서 나가서 오른쪽으로 가시면 돼요. 더 자세히 설명해 드릴까요?';
   else r='네, 도와드릴게요. 객실에 불편한 점이 있으세요, 아니면 주변 정보를 찾으세요?';
 } else if(s==='transit'){
   if(m.place)r=`${m.place}에 가시는군요. 여기서 지하철을 타는 게 제일 편해요. 환승 방법도 알려 드릴까요?`;
   else if(/몇 분|얼마나|시간/.test(t))r='보통 삼십 분 정도 걸려요. 지금 바로 출발하실 거예요?';
   else if(/버스/.test(t))r='버스도 갈 수 있지만 지하철이 더 단순해요. 버스로 가고 싶으세요?';
   else if(/지하철|전철/.test(t))r='네, 지하철로 가면 돼요. 어느 역까지 가세요?';
   else r='어디에 가려고 하세요? 목적지를 말해 주세요.';
 } else if(s==='shopping'){
   if(/얼마|가격/.test(t))r='이건 오만 원이에요. 지금 할인해서 조금 더 저렴해요. 입어 보실래요?';
   else if(/사이즈|큰|작/.test(t))r='네, 다른 사이즈도 있어요. 평소에 어떤 사이즈 입으세요?';
   else if(/색|검정|하얀|파란|분홍/.test(t))r='네, 다른 색도 있습니다. 어떤 색을 찾으세요?';
   else if(/입어|신어|써 봐/.test(t))r='물론이죠. 피팅룸은 저쪽이에요. 필요하면 다른 사이즈도 가져다드릴게요.';
   else r='네, 천천히 보세요. 찾는 스타일이나 필요한 게 있으면 말씀해 주세요.';
 } else r=makeGenericReply(t);
 return levelReply(r)}

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function goodMeaning(x){return x&&x.meaning&&!/照合できません|日本語意味/.test(x.meaning)}
function optionSet(correct,candidates){const uniq=[...new Set(candidates.filter(x=>x&&x!==correct))];const pick=shuffle(uniq).slice(0,3);const opts=shuffle([correct,...pick]);return {o:opts,a:opts.indexOf(correct)}}
function makeVocabMini(lv){let pool=state.vocabData.filter(x=>x.level===lv&&goodMeaning(x));if(pool.length<24)pool=state.vocabData.filter(x=>x.rank<=VOCAB_TARGETS[lv-1]&&goodMeaning(x));if(pool.length<20)return [];
 const targets=shuffle(pool).slice(0,20), all=state.vocabData.filter(goodMeaning);return targets.map((x,i)=>{let z,q,cat='単語';if(i%5===0){z=optionSet(x.meaning,all.map(y=>y.meaning));q={q:'音声を聞いて、最も近い意味を選んでください。',audio:x.reading||x.korean,cat:'単語Listening'}}else if(i%4===1){z=optionSet(x.korean,all.filter(y=>y.level<=lv).map(y=>y.korean));q={q:`「${x.meaning}」に当たる韓国語は？`,cat}}else{z=optionSet(x.meaning,all.map(y=>y.meaning));q={q:`${x.korean} の意味として最も近いものは？`,text:x.korean,cat}}return {id:i+1,...q,o:z.o,a:z.a,e:`${x.korean}（${x.kana||''}）＝ ${x.meaning}。${x.reading&&x.reading!==x.korean?`実発音は ${x.reading}。`:''}`}})}
function grammarItemsUpTo(lv){return Object.entries(grammarCurriculum).filter(([n])=>Number(n)<=lv).flatMap(([,g])=>g.items)}
function makeGrammarMini(lv){const current=grammarCurriculum[lv].items,all=grammarItemsUpTo(lv),examples=all.flatMap(x=>x.ex.map(e=>({jp:e[1],ko:e[0],item:x})));const qs=[];for(let i=0;i<10;i++){const x=current[i%current.length];if(i<6){const z=optionSet(x.n,all.map(y=>y.n));qs.push({id:i+1,cat:'文法',q:`${x.p} の意味として最も近いものは？`,text:x.p,o:z.o,a:z.a,e:`${x.p} は「${x.n}」。${x.d}`})}else{const ex=x.ex[i% x.ex.length],z=optionSet(ex[1],examples.map(e=>e.jp));qs.push({id:i+1,cat:'文法Reading',q:'次の文の意味として最も近いものは？',text:ex[0],o:z.o,a:z.a,e:`${ex[0]} ＝ ${ex[1]}。使われている中心文法は ${x.p}（${x.n}）です。`})}}return qs}
function makeListeningMini(){const all=[...listenBank.phrase,...listenBank.dialogue,...listenBank.speech];return shuffle(all).slice(0,10).map((x,i)=>({id:i+1,cat:x.lines?'会話Listening':(i%3===0?'スピーチListening':'Listening'),q:x.q,o:[...x.o],a:x.a,e:x.e,...(x.lines?{lines:[...x.lines]}:{audio:x.audio})}))}
function startMini(type,lv=state.miniLevel){state.miniType=type;state.miniLevel=Math.max(1,Math.min(10,Number(lv)||1));localStorage.setItem('korean-mini-level',String(state.miniLevel));let qs=type==='vocab'?makeVocabMini(state.miniLevel):type==='grammar'?makeGrammarMini(state.miniLevel):makeListeningMini();if(type==='vocab'&&!qs.length){state.learnTab='vocab';state.vocabLevel=state.miniLevel;state.view='learn';render();alert('単語テストには10,000語辞書の初回準備が必要です。「10,000語を準備する」を先に実行してください。');return}state.miniQuestions=qs;state.miniIndex=0;state.miniAnswers={};state.miniResult=null;state.miniActive=true;state.view='progress';render()}
function recordTest(type,level,result,qs=[]){const entry={id:Date.now()+Math.random(),ts:Date.now(),date:new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}),type,level,score:result.score,correct:result.correct,total:qs.length||0,cats:result.cats||{}};state.testHistory=[...state.testHistory,entry].slice(-120);localStorage.setItem('korean-test-history',JSON.stringify(state.testHistory));return entry}
function latestType(type){return [...state.testHistory].reverse().find(x=>x.type===type)}
function catScore(names){for(const h of [...state.testHistory].reverse()){const vals=names.map(n=>h.cats&&h.cats[n]).filter(Boolean);if(vals.length){const ok=vals.reduce((a,v)=>a+v.ok,0),total=vals.reduce((a,v)=>a+v.total,0);return total?Math.round(ok/total*100):0}}return 0}
function skillScores(){return {vocab:latestType('単語')?.score||catScore(['語彙']),grammar:latestType('文法')?.score||0,listening:latestType('Listening')?.score||catScore(['Listening','会話Listening','スピーチListening','単語Listening']),reading:catScore(['Reading','文法Reading']),practical:catScore(['実践','実践理解','会話Listening'])}}
function radarPoints(vals,r=100,c=150){return vals.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/5,rr=r*v/100;return `${(c+Math.cos(a)*rr).toFixed(1)},${(c+Math.sin(a)*rr).toFixed(1)}`}).join(' ')}
function radarSvg(sk){const vals=[sk.vocab,sk.grammar,sk.listening,sk.reading,sk.practical],labs=['単語','文法','Listening','Reading','実践'];const c=150,r=95;let grids=[25,50,75,100].map(p=>`<polygon points="${radarPoints([p,p,p,p,p],r,c)}" fill="none" stroke="#e6e6e3" stroke-width="1"/>`).join('');let axes=labs.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/5;return `<line x1="${c}" y1="${c}" x2="${c+Math.cos(a)*r}" y2="${c+Math.sin(a)*r}" stroke="#ececea"/>`}).join('');let labels=labs.map((lab,i)=>{const a=-Math.PI/2+i*Math.PI*2/5,rr=122;return `<text x="${c+Math.cos(a)*rr}" y="${c+Math.sin(a)*rr+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#555">${lab}</text>`}).join('');return `<svg class="radarChart" viewBox="0 0 300 300" role="img" aria-label="5スキルバランス">${grids}${axes}<polygon points="${radarPoints(vals,r,c)}" fill="rgba(255,132,183,.20)" stroke="#111" stroke-width="2"/>${vals.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/5,rr=r*v/100;return `<circle cx="${c+Math.cos(a)*rr}" cy="${c+Math.sin(a)*rr}" r="4" fill="#111"/>`}).join('')}${labels}</svg>`}
function lineSvg(hist){if(!hist.length)return `<div class="emptyChart">まだテスト結果がありません。<br>単語・文法・Listeningのミニテストを受けると、ここに実際の得点推移が表示されます。</div>`;const data=hist.slice(-12),w=640,h=220,pL=38,pR=16,pT=18,pB=42,plotW=w-pL-pR,plotH=h-pT-pB;const x=i=>pL+(data.length===1?plotW/2:i*plotW/(data.length-1)),y=v=>pT+(100-v)*plotH/100;const pts=data.map((d,i)=>`${x(i)},${y(d.score)}`).join(' ');const grid=[0,25,50,75,100].map(v=>`<g><line x1="${pL}" y1="${y(v)}" x2="${w-pR}" y2="${y(v)}" stroke="#ececea"/><text x="${pL-8}" y="${y(v)+4}" text-anchor="end" font-size="9" fill="#999">${v}</text></g>`).join('');const dots=data.map((d,i)=>`<g><circle cx="${x(i)}" cy="${y(d.score)}" r="4.5" fill="#111"/><text x="${x(i)}" y="${Math.max(10,y(d.score)-9)}" text-anchor="middle" font-size="9" font-weight="800">${d.score}</text><text x="${x(i)}" y="${h-20}" text-anchor="middle" font-size="8" fill="#888">${d.type.slice(0,4)}</text></g>`).join('');return `<svg class="lineChart" viewBox="0 0 ${w} ${h}" role="img" aria-label="テスト得点推移">${grid}<polyline points="${pts}" fill="none" stroke="#111" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`}
function miniTitle(){return state.miniType==='vocab'?`Level ${state.miniLevel} 単語テスト`:state.miniType==='grammar'?`Level ${state.miniLevel} 文法ミニテスト`:'Listening ミニテスト'}
function progress(){if(state.miniActive){if(state.miniResult)return reviewPage(state.miniQuestions,state.miniAnswers,state.miniResult,miniTitle(),'MINI TEST');return quizPage(state.miniQuestions,state.miniIndex,state.miniAnswers,'mini')}const sk=skillScores(),hist=state.testHistory;return `<section class="card growthHero"><span class="pill">GROWTH DASHBOARD</span><h2>点数より、伸び方を見る。</h2><p>単語・文法・Listening・Reading・実践理解を別々に記録します。短いミニテストを繰り返し、<b>前より何が伸びたか／どこが弱いか</b>を見える化します。</p><div class="heroActions"><button class="primary" data-mini-start="vocab" data-mini-level="${state.currentLevel}">単語20問 →</button><button class="ghost" data-mini-start="grammar" data-mini-level="${state.currentLevel}">文法10問</button><button class="ghost" data-mini-start="listening" data-mini-level="1">Listening 10問</button></div></section><div class="sectionTitle"><h2>成長推移</h2><p>直近12回 · 100点満点</p></div><div class="growthGrid"><section class="card chartCard"><div class="chartHead"><div><div class="eyebrow">SCORE TREND</div><h3>ミニテスト得点</h3></div><p>${hist.length}回記録</p></div>${lineSvg(hist)}</section><section class="card chartCard"><div class="chartHead"><div><div class="eyebrow">SKILL BALANCE</div><h3>5角形バランス</h3></div><p>最新実績</p></div>${radarSvg(sk)}<div class="radarLegend">${[['単語',sk.vocab],['文法',sk.grammar],['Listening',sk.listening],['Reading',sk.reading],['実践',sk.practical]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}%</b></div>`).join('')}</div></section></div><div class="sectionTitle"><h2>ミニテスト</h2><p>短時間で何度も回す</p></div><div class="miniLevelRow">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button class="${state.miniLevel===n?'active':''}" data-mini-level-select="${n}">L${n}</button>`).join('')}</div><div class="miniLaunchGrid"><section class="miniLaunch"><span class="miniCount">20 QUESTIONS</span><b style="margin-top:10px">単語テスト · Level ${state.miniLevel}</b><p>韓→日、日→韓、音声→意味を混ぜて出題。毎回ランダムなので丸暗記を防ぎます。</p><button class="primary" data-mini-start="vocab" data-mini-level="${state.miniLevel}">20問スタート</button></section><section class="miniLaunch"><span class="miniCount">10 QUESTIONS</span><b style="margin-top:10px">文法ミニテスト · Level ${state.miniLevel}</b><p>文法の意味と例文理解を確認。終了後は全問レビューできます。</p><button class="primary" data-mini-start="grammar" data-mini-level="${state.miniLevel}">10問スタート</button></section><section class="miniLaunch"><span class="miniCount">10 QUESTIONS</span><b style="margin-top:10px">Listening ミニテスト</b><p>短音声・A/B会話・スピーチを混ぜ、音だけで意味を取る力を確認します。</p><button class="primary" data-mini-start="listening">10問スタート</button></section></div><div class="sectionTitle"><h2>最近の記録</h2><p>新しい順</p></div><section class="card">${hist.length?`<div class="historyList">${[...hist].reverse().slice(0,12).map(h=>`<div class="historyRow"><span class="scoreBadge">${h.type}</span><div>Level ${h.level}<div style="color:#999;margin-top:3px">${h.correct}/${h.total||'-'}問</div></div><strong>${h.score}</strong><span class="historyDate" style="color:#999">${h.date}</span></div>`).join('')}</div>`:'<div class="emptyChart" style="min-height:120px">まだ記録がありません。最初のミニテストを受けてみましょう。</div>'}</section>`}

function examIntro(){return `<section class="card hero"><span class="pill">LEVEL UP EXAM · L1 → L2</span><h2>Level 1 昇格試験 · 40問</h2><p>短い問題だけでなく、<b>A/B会話・ミニスピーチListening</b>も含めます。出題に使う文字・語彙・表現はLevel 1の12単元からのみ。終了後は40問すべてレビューできます。</p><div class="examStats"><span class="examStat">40問</span><span class="examStat">目安 30〜40分</span><span class="examStat">合格 80%</span><span class="examStat">Writingなし</span><span class="examStat">Speaking採点なし</span></div><div class="heroActions"><button class="primary" id="startExam">試験を開始する →</button></div></section><div class="sectionTitle"><h2>出題構成</h2><p>問題数だけでなく角度を増やす</p></div><div class="metrics"><div class="metric"><span>文字＋語彙</span><strong>16</strong><small>問</small></div><div class="metric"><span>Reading</span><strong>8</strong><small>問</small></div><div class="metric"><span>単音声 Listening</span><strong>6</strong><small>問</small></div><div class="metric"><span>会話・Speech・実践</span><strong>10</strong><small>問</small></div></div>`}
function quizPage(qs,idx,answers,kind){const q=qs[idx],sel=answers[q.id];return `<section class="card"><div class="examHeader"><div><span class="pill">${q.cat}</span><h2 style="font-size:21px">${kind==='exam'?'Level 1 昇格試験':'Level 1 確認テスト'}</h2></div><div class="examStats"><span class="examStat">${idx+1} / ${qs.length}</span><span class="examStat">回答済 ${Object.keys(answers).length}</span></div></div><div class="questionNav">${qs.map((x,i)=>`<button class="qdot ${answers[x.id]!==undefined?'done':''} ${i===idx?'current':''}" data-${kind}q="${i}">${i+1}</button>`).join('')}</div><div class="examQ"><h3>${q.q}</h3>${q.lines?`<button class="secondary speakLines" data-lines='${JSON.stringify(q.lines)}'>▶ A/B会話を聞く</button>`:''}${q.audio?`<button class="secondary speak" data-audio="${q.audio}">▶ 音声を聞く</button>`:''}${q.text?`<div class="korean" style="font-size:28px;font-weight:800;margin:18px 0">${q.text}</div>`:''}<div class="options">${q.o.map((o,i)=>`<button class="option ${kind}Opt ${sel===i?'selected':''}" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div></div><div class="examNav"><button class="ghost" id="${kind}Prev" ${idx===0?'disabled':''}>← 前へ</button>${idx<qs.length-1?`<button class="primary" id="${kind}Next">次へ →</button>`:`<button class="primary" id="${kind}Finish" ${Object.keys(answers).length<qs.length?'disabled':''}>採点する</button>`}</div></section>`}
function calcResult(qs,answers){const correct=qs.filter(q=>answers[q.id]===q.a).length;const cats={};qs.forEach(q=>{if(!cats[q.cat])cats[q.cat]={ok:0,total:0};cats[q.cat].total++;if(answers[q.id]===q.a)cats[q.cat].ok++});return {correct,score:Math.round(correct/qs.length*100),cats}}
function reviewPage(qs,answers,r,title,subtitle){return `<section class="card hero"><span class="pill">RESULT · ${subtitle}</span><div class="resultScore">${r.score}<span style="font-size:22px">/100</span></div><h2>${r.score>=80?'理解できています。':'復習してもう一度。'}</h2><p>${r.correct} / ${qs.length}問正解。下の一覧から各問題へジャンプし、<b>問題・自分の回答・正解・解説・なぜ間違いか</b>を確認できます。</p><div class="heroActions"><button class="primary" id="reviewRestart">もう一度受ける</button>${state.view==='progress'?'<button class="ghost" id="reviewDashboard">成長画面へ戻る</button>':'<button class="ghost" data-go="learn">学習へ戻る</button>'}</div></section><div class="sectionTitle"><h2>分野別結果</h2><p>弱点を次の復習に使う</p></div><div class="grid3">${Object.entries(r.cats).map(([c,v])=>`<div class="card"><b>${c}</b><div style="font-size:24px;font-weight:900;margin-top:8px">${Math.round(v.ok/v.total*100)}%</div><div class="categoryBar"><div style="width:${v.ok/v.total*100}%"></div></div><div style="font-size:10px;color:var(--muted);margin-top:7px">${v.ok} / ${v.total} 正解</div></div>`).join('')}</div><div class="sectionTitle"><h2>問題一覧</h2><p>クリックすると詳細へ</p></div><div class="reviewIndex">${qs.map(q=>`<a class="${answers[q.id]===q.a?'ok':'ng'}" href="#review-q-${q.id}">${q.id}</a>`).join('')}</div><div class="sectionTitle"><h2>${title} · 全問レビュー</h2><p>誤答だけでなく正答も残す</p></div>${qs.map(q=>{const ua=answers[q.id],ok=ua===q.a;return `<section class="card reviewCard" id="review-q-${q.id}"><div class="reviewTop"><div><span class="pill">Q${q.id} · ${q.cat}</span><h3 style="margin:12px 0 0">${q.q}</h3></div><span class="tag" style="${ok?'background:#eff9f5;color:#216e58':'background:#fff2f5;color:#963e53'}">${ok?'正解':'要復習'}</span></div>${q.text?`<div class="korean" style="font-size:21px;font-weight:800;margin-top:12px">${q.text}</div>`:''}<div class="reviewAnswers"><div class="answerBox ${ok?'correctA':'userWrong'}"><b>YOUR ANSWER</b>${ua===undefined?'未回答':String.fromCharCode(65+ua)+'. '+q.o[ua]}</div><div class="answerBox correctA"><b>CORRECT ANSWER</b>${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</div></div><div class="feedback ${ok?'ok':'ng'}"><b>${ok?'解説':'なぜ間違いか'}</b><br>${ok?q.e:`あなたが選んだ「${q.o[ua]}」ではなく、正解は「${q.o[q.a]}」です。${q.e}`}</div></section>`}).join('')}`}
function examView(){if(!state.examStarted)return examIntro();if(state.examResult)return reviewPage(exam,state.answers,state.examResult,'Level 1 昇格試験','LEVEL UP EXAM');return quizPage(exam,state.qIndex,state.answers,'exam')}
function setLiveStatus(status,message=''){state.liveStatus=status;if(message)state.liveMessage=message;const label={ready:'準備完了',speaking:'相手が話しています',listening:'あなたの番です',processing:'返答を組み立てています',ended:'会話終了',error:'マイクエラー'}[status]||status;const statusText=document.getElementById('liveStatusText');if(statusText)statusText.textContent=message||({listening:'考えすぎず、そのまま韓国語で返してください。',processing:'返答を組み立てています…',speaking:'相手の韓国語を意味として聞き取ってください。'}[status]||'');const badge=document.querySelector('.liveBadge');if(badge)badge.innerHTML=`<span class="liveDot ${status==='speaking'?'speaking':status==='listening'?'listening':status==='processing'?'processing':''}"></span>${label}`;const mic=document.getElementById('aiMic');if(mic){mic.className='aiMicOrb '+(status==='listening'?'listening':status==='speaking'?'speaking':status==='processing'?'processing':'');mic.textContent=status==='listening'?'🎙':status==='speaking'?'◉':'·'}const wave=document.getElementById('aiWave');if(wave)wave.className='wave '+(status==='speaking'?'active':'')}
function renderAILog(){const el=document.getElementById('aiLiveLog');if(!el)return;const sc=liveScenarios[state.liveScenario];el.innerHTML=state.liveHistory.length?state.liveHistory.map(m=>`<div class="liveMsg ${m.who}"><b>${m.who==='partner'?sc.role:'YOU'}</b><div class="korean">${m.text}</div>${m.note?`<small>${m.note}</small>`:''}</div>`).join(''):'<div class="liveHint">会話ログはここに表示されます。</div>';el.scrollTop=el.scrollHeight}
function addAILog(who,text,note=''){if(!text)return;state.liveHistory.push({who,text,note});renderAILog()}
function speakLive(text,rate=levelRate(),done){if(!('speechSynthesis' in window)){if(done)setTimeout(done,500);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;u.pitch=1;const vs=speechSynthesis.getVoices(),ko=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));if(ko)u.voice=ko;u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.speak(u)}
function clearLiveTimers(){if(liveTimer)clearInterval(liveTimer);if(liveSilenceTimer)clearTimeout(liveSilenceTimer);liveTimer=liveSilenceTimer=null}
function stopLive(renderAfter=true){clearLiveTimers();try{if(liveRecognition)liveRecognition.abort()}catch{}liveRecognition=null;try{speechSynthesis.cancel()}catch{}state.liveActive=false;state.liveStatus='ready';state.liveInterim='';if(renderAfter)render()}
async function startAIConversation(){if(!await ensureMicPermission())return;stopLive(false);if(state.localMode!=='rules'&&(state.localAIStatus!=='ready'||localAIModel!==localModelId())){await loadLocalAI();if(state.localAIStatus!=='ready'||localAIModel!==localModelId())return;}liveMemory={topic:'',lastUser:'',lastPartner:'',name:'',place:'',food:'',mood:'',activity:'',turns:0};localAIMessages=state.localMode==='rules'?[]:[{role:'system',content:localSystemPrompt()}];state.liveHistory=[];state.liveTurn=0;state.liveActive=true;state.liveInterim='';const sc=liveScenarios[state.liveScenario];const first=pick(sc.first);state.liveCurrent=first;state.liveMessage='まず相手の韓国語を聞いて、音声が終わったらすぐ返してください。';state.liveStatus='speaking';addAILog('partner',first);render();speakLive(first,levelRate(),()=>beginLiveListening())}
function beginLiveListening(){if(!state.liveActive)return;if(state.micPermission!=='granted'){state.liveStatus='error';state.liveMessage='マイクが未許可です。「マイクを許可」を押してください。';render();return}clearLiveTimers();state.liveStatus='listening';state.liveMessage='今すぐ韓国語で返してください。';state.liveInterim='';render();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.liveMessage='このブラウザは音声認識に非対応です。下の入力欄で会話を続けられます。';render();return}try{const r=new SR();liveRecognition=r;r.lang='ko-KR';r.interimResults=true;r.continuous=false;r.maxAlternatives=3;let finalText='';r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=txt;else interim+=txt}state.liveInterim=(finalText||interim).trim();const box=document.querySelector('.recognition .korean');if(box)box.textContent=state.liveInterim};r.onerror=e=>{liveRecognition=null;if(e.error==='not-allowed'||e.error==='service-not-allowed'){state.micPermission='denied';state.liveStatus='error';state.liveMessage='マイクが拒否されています。サイト設定からマイクを許可してください。'}else if(e.error==='audio-capture'){state.micPermission='no-device';state.liveStatus='error';state.liveMessage='マイクを取得できません。端末のマイク設定を確認してください。'}else if(e.error==='network'){state.liveStatus='error';state.liveMessage='音声認識サービスに接続できませんでした。通信状態を確認するか、テキスト入力を使ってください。'}else if(e.error==='no-speech'){state.liveStatus='listening';state.liveMessage='音声が聞き取れませんでした。もう一度話してください。'}else{state.liveStatus='listening';state.liveMessage='うまく聞き取れませんでした。もう一度話してください。'}render()};r.onend=()=>{liveRecognition=null;if(finalText.trim())processLiveUser(finalText.trim());else if(state.liveActive&&state.liveStatus==='listening'){state.liveMessage='聞き取れませんでした。もう一度そのまま話してください。';render()}};r.start()}catch(e){state.liveStatus='error';state.liveMessage='マイクを開始できませんでした。';render()}}
async function processLiveUser(text){if(!state.liveActive||!text.trim())return;try{if(liveRecognition)liveRecognition.stop()}catch{}liveRecognition=null;state.liveInterim='';addAILog('you',text,'音声認識結果');state.liveStatus='processing';state.liveMessage=state.localMode==='rules'?'発言内容から次の返答を組み立てています…':'端末内AIが返答を生成しています…';render();liveMemory.turns++;state.liveTurn++;let reply=state.localMode==='rules'?scenarioReply(text):await generateLocalAIReply(text);if(!state.liveActive)return;liveMemory.lastPartner=reply;state.liveCurrent=reply;state.liveMessage='相手の返答を聞いて、そのまま続けてください。';addAILog('partner',reply,state.localMode==='rules'?'Instant engine':'On-device AI');state.liveStatus='speaking';render();speakLive(reply,levelRate(),()=>beginLiveListening())}
function render(){document.getElementById('sideNav').innerHTML=navHTML();document.getElementById('mobileNav').innerHTML=navHTML(true);document.getElementById('profileLevel').textContent='Level '+state.currentLevel;document.getElementById('pageTitle').textContent=state.view==='home'?'오늘도 한걸음。':nav.find(x=>x[0]===state.view)[2];let html=state.view==='home'?home():state.view==='learn'?learn():state.view==='listen'?listen():state.view==='progress'?progress():state.view==='exam'?examView():roadmap();document.getElementById('content').innerHTML=html;/* data-go navigation is handled by one delegated listener below so mobile tabs remain reliable after every re-render. */document.querySelectorAll('[data-learn-tab-open]').forEach(b=>b.addEventListener('click',()=>{state.learnTab=b.dataset.learnTabOpen;localStorage.setItem('korean-learn-tab',state.learnTab);go('learn')}));document.querySelectorAll('.speak').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.audio)));document.querySelectorAll('.speakLines').forEach(b=>b.addEventListener('click',()=>speakLines(JSON.parse(b.dataset.lines))));
if(state.view==='learn'){document.querySelectorAll('[data-learn-tab]').forEach(b=>b.onclick=()=>{state.learnTab=b.dataset.learnTab;localStorage.setItem('korean-learn-tab',state.learnTab);state.vocabPage=1;render();if(state.learnTab==='vocab'&&!state.vocabData.length)loadVocabCache().then(ok=>{if(ok&&state.view==='learn'&&state.learnTab==='vocab')render()})});document.querySelectorAll('[data-vocab-level]').forEach(b=>b.onclick=()=>{state.vocabLevel=Number(b.dataset.vocabLevel);state.vocabPage=1;localStorage.setItem('korean-vocab-level',String(state.vocabLevel));render()});const vs=document.getElementById('setupVocab');if(vs)vs.onclick=buildVocabDataset;const vsearch=document.getElementById('vocabSearch');if(vsearch){const applyVocabSearch=()=>{state.vocabSearch=vsearch.value.trim();state.vocabPage=1;render()};vsearch.onchange=applyVocabSearch;vsearch.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();applyVocabSearch()}}};const vm=document.getElementById('vocabMode');if(vm)vm.onchange=()=>{state.vocabMode=vm.value;state.vocabPage=1;localStorage.setItem('korean-vocab-mode',state.vocabMode);render()};const vps=document.getElementById('vocabPageSize');if(vps)vps.onchange=()=>{state.vocabPageSize=Number(vps.value);state.vocabPage=1;render()};document.querySelectorAll('[data-vocab-known]').forEach(b=>b.onclick=()=>{const w=b.dataset.vocabKnown;state.vocabKnown[w]=!state.vocabKnown[w];localStorage.setItem('korean-vocab-known',JSON.stringify(state.vocabKnown));render()});const vp=document.getElementById('vocabPrev');if(vp)vp.onclick=()=>{state.vocabPage=Math.max(1,state.vocabPage-1);render();window.scrollTo({top:0,behavior:'smooth'})};const vn=document.getElementById('vocabNext');if(vn)vn.onclick=()=>{state.vocabPage++;render();window.scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('[data-grammar-level]').forEach(b=>b.onclick=()=>{state.grammarLevel=Number(b.dataset.grammarLevel);localStorage.setItem('korean-grammar-level',String(state.grammarLevel));render()});document.querySelectorAll('[data-grammar-done]').forEach(b=>b.onclick=()=>{const id=b.dataset.grammarDone;state.grammarDone[id]=!state.grammarDone[id];localStorage.setItem('korean-grammar-done',JSON.stringify(state.grammarDone));render()});const s=document.getElementById('startPractice');if(s)s.onclick=()=>{state.practiceStarted=true;state.pIndex=0;state.pAnswers={};state.practiceResult=null;render()};document.querySelectorAll('[data-mini-start]').forEach(b=>b.onclick=()=>startMini(b.dataset.miniStart,Number(b.dataset.miniLevel||state.currentLevel)));bindQuiz('practice',practice,()=>state.pIndex,v=>state.pIndex=v,state.pAnswers,v=>{state.practiceResult=v;recordTest('総合',1,v,practice)})}
if(state.view==='listen'){document.querySelectorAll('[data-lmode]').forEach(b=>b.onclick=()=>{state.listenMode=b.dataset.lmode;state.listenIndex=0;state.listenSelected=null;state.listenChecked=false;render()});document.querySelectorAll('.listenOpt').forEach(b=>b.onclick=()=>{if(!state.listenChecked){state.listenSelected=Number(b.dataset.i);render()}});const c=document.getElementById('checkListen');if(c)c.onclick=()=>{state.listenChecked=true;render()};const n=document.getElementById('nextListen');if(n)n.onclick=()=>{state.listenIndex=(state.listenIndex+1)%listenBank[state.listenMode].length;state.listenSelected=null;state.listenChecked=false;render()}}
if(state.view==='progress'){document.querySelectorAll('[data-mini-level-select]').forEach(b=>b.onclick=()=>{state.miniLevel=Number(b.dataset.miniLevelSelect);localStorage.setItem('korean-mini-level',String(state.miniLevel));render()});document.querySelectorAll('[data-mini-start]').forEach(b=>b.onclick=()=>startMini(b.dataset.miniStart,Number(b.dataset.miniLevel||state.miniLevel)));if(state.miniActive&&!state.miniResult)bindQuiz('mini',state.miniQuestions,()=>state.miniIndex,v=>state.miniIndex=v,state.miniAnswers,v=>{state.miniResult=v;recordTest(state.miniType==='vocab'?'単語':state.miniType==='grammar'?'文法':'Listening',state.miniLevel,v,state.miniQuestions)})}
if(state.view==='exam'){const s=document.getElementById('startExam');if(s)s.onclick=()=>{state.examStarted=true;state.qIndex=0;state.answers={};state.examResult=null;render()};bindQuiz('exam',exam,()=>state.qIndex,v=>state.qIndex=v,state.answers,v=>{state.examResult=v;recordTest('昇格',1,v,exam);if(v.score>=80&&state.currentLevel===1){state.currentLevel=2;localStorage.setItem('korean-current-level','2')}})}
const rr=document.getElementById('reviewRestart');if(rr)rr.onclick=()=>{if(state.view==='exam'){state.examStarted=true;state.qIndex=0;state.answers={};state.examResult=null}else if(state.view==='progress'){startMini(state.miniType,state.miniLevel);return}else{state.practiceStarted=true;state.pIndex=0;state.pAnswers={};state.practiceResult=null}render()};const rd=document.getElementById('reviewDashboard');if(rd)rd.onclick=()=>{state.miniActive=false;state.miniResult=null;state.miniQuestions=[];state.miniAnswers={};render()}}
function bindQuiz(kind,qs,getIdx,setIdx,answers,setResult){document.querySelectorAll(`[data-${kind}q]`).forEach(b=>b.onclick=()=>{setIdx(Number(b.dataset[`${kind}q`]));render()});document.querySelectorAll(`.${kind}Opt`).forEach(b=>b.onclick=()=>{answers[qs[getIdx()].id]=Number(b.dataset.i);render()});const p=document.getElementById(kind+'Prev');if(p)p.onclick=()=>{if(getIdx()>0){setIdx(getIdx()-1);render()}};const n=document.getElementById(kind+'Next');if(n)n.onclick=()=>{if(getIdx()<qs.length-1){setIdx(getIdx()+1);render()}};const f=document.getElementById(kind+'Finish');if(f)f.onclick=()=>{setResult(calcResult(qs,answers));render()}}

let deferredInstallPrompt=null;
const isStandalone=()=>window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;
const isHttpPage=()=>location.protocol==='https:'||location.protocol==='http:';
const isSecurePwaContext=()=>location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
function realShareUrl(){
  const configured=(window.HANGEORUM_PUBLIC_URL||'').trim();
  if(configured && /^https:\/\//i.test(configured)) return configured;
  if(isHttpPage()) return location.href.split('#')[0];
  return '';
}
function sharePayload(extra=''){
  const url=realShareUrl();
  return {title:'한걸음｜韓国語学習',text:`韓国語 Level ${state.currentLevel}/10 を学習中。${extra||'単語・文法・Listening・Readingを中心に勉強しています。'}`,url};
}
function explainPreviewLimit(action){
  const msg=action==='install'
    ?'このChatGPT内プレビューは通常のHTTPSサイトではないため、ホーム画面には追加できません。ZIPをHTTPSサイトへ公開してSafari/Chromeから直接開くと追加できます。'
    :'このChatGPT内プレビューの sandbox: URL は外部共有できないため、リンクとして送信しません。HTTPSで公開したページを直接開くと、同じボタンから実URLを共有できます。';
  alert(msg);
}
async function copyRealLink(extra=''){
  const d=sharePayload(extra);
  if(!d.url){explainPreviewLimit('share');return false;}
  try{await navigator.clipboard.writeText(d.url);alert('リンクをコピーしました。');return true}catch(e){
    const ta=document.createElement('textarea');ta.value=d.url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('リンクをコピーしました。');return true;
  }
}
async function shareNative(extra=''){
  const data=sharePayload(extra);
  if(!data.url){explainPreviewLimit('share');return;}
  const payload={title:data.title,text:data.text,url:data.url};
  if(navigator.share && (!navigator.canShare || navigator.canShare(payload))){
    try{await navigator.share(payload);return}catch(e){if(e&&e.name==='AbortError')return;}
  }
  await copyRealLink(extra);
}
function shareLine(extra=''){
  const d=sharePayload(extra);
  if(!d.url){explainPreviewLimit('share');return;}
  const url='https://social-plugins.line.me/lineit/share?url='+encodeURIComponent(d.url)+'&text='+encodeURIComponent(d.text);
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(!w) location.href=url;
}
async function requestInstall(){
  if(isStandalone()){alert('すでにホーム画面からアプリとして起動しています。');return;}
  if(!isSecurePwaContext()){explainPreviewLimit('install');return;}
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice=await deferredInstallPrompt.userChoice;
    if(choice?.outcome==='accepted') deferredInstallPrompt=null;
    return;
  }
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isiOS){
    alert('iPhone / iPad：ブラウザの共有ボタン（□↑）→「ホーム画面に追加」→「追加」を選んでください。iOS 16.4以降は主要ブラウザの共有メニューから追加できます。');
  }else{
    alert('Chrome / Edge：ブラウザメニューの「アプリをインストール」または「ホーム画面に追加」を選んでください。インストール候補が出ない場合は、一度ページを再読み込みしてください。');
  }
}
function bindGlobalShare(){
  const a=document.getElementById('shareBtn'),l=document.getElementById('lineShareBtn'),hs=document.getElementById('homeShare'),hl=document.getElementById('homeLine'),ins=document.getElementById('installBtn');
  if(a)a.onclick=()=>shareNative();
  if(l)l.onclick=()=>shareLine();
  if(hs)hs.onclick=()=>shareNative();
  if(hl)hl.onclick=()=>shareLine();
  if(ins){ins.onclick=requestInstall;ins.textContent=isStandalone()?'✓ アプリ起動中':'＋ ホームに追加';}
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;bindGlobalShare();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;bindGlobalShare();});
if('serviceWorker' in navigator && isSecurePwaContext()) navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
const originalRender=render;render=function(){originalRender();bindGlobalShare()};
render();
loadVocabCache().then(ok=>{if(ok&&state.view==='learn'&&state.learnTab==='vocab')render()});
</script>
