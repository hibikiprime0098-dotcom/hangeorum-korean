;document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="boot"><div><b>起動に失敗しました</b><p>'+String(e.message||e)+'</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:10px;font-weight:800">再読み込み</button></div></div>'}})();</script></body></html>
