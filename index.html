<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0c0c"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>한걸음｜韓国語学習</title><style>body{margin:0;font-family:system-ui;background:#f4f4f2;color:#101010}.load{min-height:100vh;display:grid;place-items:center;text-align:center}.brand{font-size:42px;font-weight:900}.bar{width:180px;height:5px;background:#ddd;border-radius:99px;overflow:hidden;margin:18px auto}.bar:after{content:"";display:block;width:45%;height:100%;background:#111;animation:m 1s infinite alternate}@keyframes m{to{transform:translateX(120px)}}</style></head><body><div class="load"><div><div class="brand">한걸음</div><p>読み込んでいます…</p><div class="bar"></div></div></div><script>(async()=>{try{const names=['c1.txt','c2.txt','c3.txt','c4.txt','c5.txt','c6.txt'];const parts=await Promise.all(names.map(n=>fetch('./'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('このブラウザは最新版への更新が必要です。');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><h1>読み込みエラー</h1><p>ページを再読み込みするか、Chrome / Safariを最新版に更新してください。</p><pre style="white-space:pre-wrap">'+String(e)+'</pre></main>'}})();</script></body></html>
