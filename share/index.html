<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>한걸음｜韓国語学習</title>
  <meta name="description" content="聞いてわかる韓国語を、少しずつ。旅行・日常会話・自然な韓国語コンテンツの理解を目指す学習アプリ。">
  <meta property="og:title" content="한걸음｜韓国語学習">
  <meta property="og:description" content="聞いてわかる韓国語を、少しずつ。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="../manifest.webmanifest">
  <style>
    html,body{margin:0;background:#f6f6f3;color:#111;font-family:system-ui,-apple-system,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot b{font-size:24px}.boot p{color:#777;line-height:1.7}
    .dot{width:42px;height:42px;border:4px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot"><div><div class="dot"></div><b>한걸음</b><p>最新版の学習環境を準備しています…</p></div></div>
  <script>
    (() => {
      try {
        const q=new URLSearchParams(location.search);
        const token=q.get('s')||'';
        const meaningfulProgress=()=>{
          try{
            if(Number(localStorage.getItem('korean-current-level')||1)>1)return true;
            const hist=JSON.parse(localStorage.getItem('korean-test-history')||'[]');
            if(Array.isArray(hist)&&hist.length)return true;
            const known=JSON.parse(localStorage.getItem('korean-vocab-known')||'{}');
            if(known&&Object.values(known).some(Boolean))return true;
            const done=JSON.parse(localStorage.getItem('korean-grammar-done')||'{}');
            if(done&&Object.values(done).some(Boolean))return true;
            const mastery=JSON.parse(localStorage.getItem('korean-auto-mastery-v93')||'{}');
            if(mastery&&Object.values(mastery).some(v=>v&&typeof v==='object'&&Object.keys(v).length))return true;
          }catch{}
          return false;
        };
        let firstOpen=!meaningfulProgress(),receipts=[];
        if(token){
          try{receipts=JSON.parse(localStorage.getItem('hg-share-receipts')||'[]')}catch{}
          if(!Array.isArray(receipts)) receipts=[];
          firstOpen=!receipts.includes(token);
          if(firstOpen&&meaningfulProgress()){
            firstOpen=confirm('この端末には既存の学習進捗があります。\n\n新規学習者としてLevel 1・0%から開始すると、現在の進捗はこの端末から削除されます。\n\n0%から開始しますか？');
          }
          receipts=[...receipts.filter(x=>x!==token).slice(-49),token];
          localStorage.setItem('hg-share-receipts',JSON.stringify(receipts));
        }
        const target = new URL('../', location.href);
        if(firstOpen) target.searchParams.set('fresh','1');
        target.searchParams.set('shared','1');
        target.searchParams.set('v','1008');
        location.replace(target.href);
      } catch (e) {
        document.querySelector('.boot p').textContent='起動に失敗しました。再読み込みしてください。';
      }
    })();
  </script>
</body>
</html>
